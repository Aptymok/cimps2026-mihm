name: MIHM Reproducibility Hub
on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare immutable Hub surface
        run: |
          cp hub/home.html hub/index.html
          printf '%s\n' '' > hub/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
